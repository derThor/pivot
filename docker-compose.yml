services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strasev
      POSTGRES_PASSWORD: strasev
      POSTGRES_DB: strasev
    ports:
      - "5432:5432"
    volumes:
      - strasev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - strasev_redis_data:/data

volumes:
  strasev_postgres_data:
  strasev_redis_data:
